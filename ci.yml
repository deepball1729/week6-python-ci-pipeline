name: Python CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    name: Lint and test (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests and create reports
        run: |
          mkdir -p reports
          pytest             --junitxml=reports/junit.xml             --cov=calculator             --cov-report=term-missing             --cov-report=xml:reports/coverage.xml             --cov-report=html:reports/htmlcov             --cov-fail-under=80

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
