[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "week6-ci-calculator"
version = "1.0.0"
description = "Example Python project for demonstrating continuous integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.coverage.run]
branch = true
source = ["calculator"]

[tool.coverage.report]
show_missing = true
skip_covered = false
